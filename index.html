<!DOCTYPE html>
<html lang="id">

<body>

<header class="d-flex align-items-center justify-content-between px-4 px-md-5 sticky-top glass-header" style="height: 80px; z-index: 1030;">

            PPIC<span style="color: #06b6d4;">SOMIC</span>
        </a>

</header>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card modern-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4 pb-2 border-bottom">
                        <div class="icon-circle mb-3">

                        </div>
                        <h4 class="fw-bold text-dark mb-1">Cetak Traceability</h4>
                        <p class="text-muted small">Lengkapi data form untuk membuat label</p>
                    </div>

                    <form id="formCetak">

                            <label class="form-label fw-bold">Pilih Template Label</label>
                            <select class="form-select fw-medium text-dark" id="model_type" required>

                                <option value="Template 2">Traceability Soket Y4L</option>
                                <option value="Template 3">Traceability Soket YLO</option>
                                <option value="Template 4">Traceability Soket YR9</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nama Operator</label>

                                <input type="text" class="form-control border-start-0 ps-0" id="operator_name" placeholder="Ketik nama Anda..." required>

                        </div>

                                <div class="col-6 mb-4">
                                    <label class="form-label fw-bold">Tgl Assembly</label>

                                </div>
                                <div class="col-6 mb-4">
                                    <label class="form-label fw-bold">Tgl Inspection</label>
                                    <input type="date" class="form-control" id="inspection_date">
                                </div>
                            </div>
                        </div>

                            <div class="col-8 mb-4">

                    </form>
                </div>

        </div>

</div>

document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("tahun").textContent = new Date().getFullYear();
    var savedName = localStorage.getItem("saved_operator_name");
    if (savedName) {
        document.getElementById("operator_name").value = savedName;
    }
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, '0'); // Bulan mulai dari 0, makanya +1
    var dd = String(today.getDate()).padStart(2, '0');
    var packingFormatted = yyyy + '-' + mm + '-' + dd;
    
    document.getElementById("packing_date").value = packingFormatted;
    var inspDate = new Date();
    inspDate.setDate(today.getDate() - 3); 
    var inspYyyy = inspDate.getFullYear();
    var inspMm = String(inspDate.getMonth() + 1).padStart(2, '0');
    var inspDd = String(inspDate.getDate()).padStart(2, '0');
    var inspFormatted = inspYyyy + '-' + inspMm + '-' + inspDd;
    
    document.getElementById("inspection_date").value = inspFormatted;
});

function formatDate(dateString) {
    if (!dateString) return '';
    var date = new Date(dateString);
    var months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    
    var day = date.getDate().toString().padStart(2, '0');
    var month = months[date.getMonth()];
    var year = date.getFullYear();
    
    return day + " " + month + " " + year;
}

document.getElementById('model_type').addEventListener('change', function() {

    if (this.value === 'Template 1') {
        kolomKhusus.style.display = 'block'; // Munculkan kalau Template 1
    } else {
        kolomKhusus.style.display = 'none';  // Sembunyikan kalau template lain
    }
});

}
    
    var htmlContent = '<!DOCTYPE html><html><head><title>Print Label Thermal</title>';
